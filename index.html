<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Card Generator</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <link rel="icon" href="https://fav.farm/🎲" />
  </head>
  <body>
    <header class="site-header">Bingo Card Generator</header>
    <section id="settings">
      <label
        >Enter Cell Values*
        <small
          >(Each cell on its own line, cells will only appear in their
          columns)</small
        ></label
      >
      <label for="valuesColumn0">B Column</label>
      <textarea
        name="valuesColumn0"
        id="valuesColumn0"
        cols="30"
        rows="10"
        placeholder="Paste/type your 5 values with each value on it's own line."
      >
1-1
1-2
1-3
1-4
1-5</textarea
      >
      <label for="valuesColumn1">I column</label>
      <textarea
        name="valuesColumn1"
        id="valuesColumn1"
        cols="30"
        rows="10"
        placeholder="Paste/type your 5 values with each value on it's own line."
      >
2-1
2-2
2-3
2-4
2-5</textarea
      >
      <label for="valuesColumn2">N Column</label>
      <textarea
        name="valuesColumn2"
        id="valuesColumn2"
        cols="30"
        rows="10"
        placeholder="Paste/type your 5 values with each value on it's own line."
      >
3-1
3-2
3-3
3-4
3-5</textarea
      >
      <label for="valuesColumn3">G Column</label>
      <textarea
        name="valuesColumn3"
        id="valuesColumn3"
        cols="30"
        rows="10"
        placeholder="Paste/type your 5 values with each value on it's own line."
      >
4-1
4-2
4-3
4-4
4-5</textarea
      >
      <label for="valuesColumn4">O Column</label>
      <textarea
        name="valuesColumn4"
        id="valuesColumn4"
        cols="30"
        rows="10"
        placeholder="Paste/type your 5 values with each value on it's own line."
      >
5-1
5-2
5-3
5-4
5-5</textarea
      >
      <label for="numCards">Number of Cards*</label>
      <input
        type="number"
        min="0"
        name="numCards"
        id="numCards"
        value="1"
        required
      />
      <label for="startNum">Start numbering*</label>
      <input
        type="number"
        min="1"
        name="startNum"
        id="startNum"
        value="1"
        required
      />
      <label for="cardTitle">Card Title</label>
      <input
        type="text"
        min="1"
        name="cardTitle"
        id="cardTitle"
        placeholder="Leave blank for Bingo"
      />
      <div class="buttons">
        <button id="generate">Generate</button>
        <button id="print" disabled="true">Print Cards</button>
      </div>
      <ul class="validation" id="validation"></ul>
    </section>
    <section id="cards"></section>
    <footer class="site-footer">
      <a
        href="https://github.com/jeffhow/bingo-card-generator"
        title="Get the code"
        target="_blank"
      >
        <img src="github-mark-white.png" alt="GitHub Logomark" width="40" />
      </a>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
